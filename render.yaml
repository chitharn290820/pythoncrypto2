services:
  - type: web
    name: crypto-momentum-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: COINGECKO_API_KEY
        sync: false   # ใส่ค่าเองใน Render Dashboard (Demo API key ฟรี)
      - key: REFRESH_HOURS
        value: "6"
